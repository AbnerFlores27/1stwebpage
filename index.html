<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>1st Webpage</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #172033;
        background: purple;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90vw, 42rem);
        padding: 3rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dfe6f0;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 10%);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3.5rem);
        color: green;
      }

      p {
        margin: 0;
        color: #526078;
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
        <h1>abner flores?</h1>
        <p style="color: black;">may 21st, 2012</p>
    </main>
  </body>
</html>
