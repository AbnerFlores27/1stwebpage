<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>1st Webpage</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #182230;
        background: orange;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: orange;
      }

      main {
        width: min(90vw, 38rem);
        padding: clamp(2rem, 7vw, 4rem);
        text-align: center;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem rgb(50 74 100 / 15%);
        backdrop-filter: blur(0.75rem);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #58728d;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: blue;
        font-size: clamp(2.5rem, 10vw, 5rem);
        letter-spacing: -0.07em;
        line-height: 0.95;
      }

      p {
        margin: 1.25rem 0 0;
        color: #58728d;
        font-size: 1rem;
        line-height: 1.6;
      }

      .birthday {
        color: black;
      }

      .accent {
        width: 3.5rem;
        height: 0.25rem;
        margin: 2rem auto 0;
        border-radius: 99rem;
        background: linear-gradient(90deg, #59b7e8, #9b82ed);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The beginning</p>
      <h1>abner flores?</h1>
      <p class="birthday">may 21st, 2012</p>
      <div class="accent" aria-hidden="true"></div>
    </main>
  </body>
</html>
