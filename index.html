<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>1st Webpage</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #182230;
        background: midnightblue;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: midnightblue;
      }

      main {
        width: min(90vw, 50rem);
        padding: clamp(2rem, 7vw, 4rem);
        text-align: center;
        background: midnightblue;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 28%);
        backdrop-filter: blur(0.75rem);
      }

      .photo-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .photo-link {
        display: block;
      }

      .gallery-photo {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 1rem;
        box-shadow: 0 1rem 2.5rem rgb(25 25 112 / 20%);
      }

      .wide-photo-placeholder {
        grid-column: 1 / -1;
        display: grid;
        place-items: center;
        width: 100%;
        aspect-ratio: 8 / 3;
        color: #b8c5ff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: #202080;
        border: 2px dashed #4da3ff;
        border-radius: 1rem;
      }

      @media (max-width: 36rem) {
        .photo-gallery {
          grid-template-columns: 1fr;
        }

        .wide-photo-placeholder {
          grid-column: 1;
          aspect-ratio: 4 / 3;
        }
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #b8c5ff;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #4da3ff;
        font-size: clamp(2.5rem, 10vw, 5rem);
        font-weight: 800;
        letter-spacing: -0.07em;
        line-height: 0.95;
      }

      p {
        margin: 1.25rem 0 0;
        color: #58728d;
        font-size: 1rem;
        line-height: 1.6;
      }

      .birthday {
        color: rgb(207, 189, 33);
      }

      .birthday-link {
        color: rgb(207, 189, 33);
        text-decoration: underline;
      }

      .accent {
        width: 3.5rem;
        height: 0.25rem;
        margin: 2rem auto 0;
        border-radius: 99rem;
        background: linear-gradient(90deg, #59b7e8, #9b82ed);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="photo-gallery">
        <a
          class="photo-link"
          href="https://www.britannica.com/facts/Mike-Trout"
          target="_blank"
          rel="noreferrer"
          aria-label="View Mike Trout facts on Britannica"
        >
          <img
            class="gallery-photo"
            src="https://cdn.britannica.com/88/221888-050-7F121E32/Baseball-player-Mike-Trout-2020.jpg"
            alt="Baseball player Mike Trout"
          />
        </a>
        <a
          class="photo-link"
          href="https://plus.unsplash.com/premium_photo-1694819488591-a43907d1c5cc"
          target="_blank"
          rel="noreferrer"
          aria-label="View the golden retriever photo source"
        >
          <img
            class="gallery-photo"
            src="images/cute-dog.jpg"
            alt="Golden retriever puppy wearing an orange collar"
          />
        </a>
        <div class="wide-photo-placeholder" role="img" aria-label="Placeholder for the next photo">
          Photo link coming soon
        </div>
      </div>
      <p class="eyebrow">The beginning</p>
      <h1>ABNER FLORES</h1>
      <p class="birthday">
        <a
          class="birthday-link"
          href="https://github.com/AbnerFlores27/1stwebpage.git"
          target="_blank"
          rel="noreferrer"
        >may 21st 2012</a>
      </p>
      <div class="accent" aria-hidden="true"></div>
    </main>
  </body>
</html>
