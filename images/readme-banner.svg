<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">ABNER FLORES</title>
  <desc id="description">A golden retriever puppy, blue ABNER FLORES heading, and gold birthday on a midnight-blue background.</desc>
  <defs>
    <clipPath id="dog-photo">
      <rect x="350" y="60" width="500" height="620" rx="32"/>
    </clipPath>
  </defs>
  <rect width="1200" height="1000" fill="#191970"/>
  <image
    href="cute-dog.jpg"
    x="350"
    y="60"
    width="500"
    height="620"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#dog-photo)"
  />
  <text
    x="600"
    y="810"
    fill="#4da3ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="78"
    font-weight="800"
    text-anchor="middle"
  >ABNER FLORES</text>
  <text
    x="600"
    y="895"
    fill="rgb(207, 189, 33)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    text-anchor="middle"
    text-decoration="underline"
  >may 21st 2012</text>
</svg>